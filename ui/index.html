<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lydia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0:#0b1020;
    --panel:rgba(255,255,255,0.06);
    --panel-solid:#101730;
    --line:rgba(255,255,255,0.10); --line-strong:rgba(255,255,255,0.18);
    --paper:#eef2ff; --dim:#a6b0d6; --dimmer:#6b7398;
    --accent:#7aa2ff; --accent-dim:#5a74d0; --accent-dark:#3b4aa8;
    --cool:#7de3d0; --cool-dim:#3f7a70;
    --alert:#ff6b7a; --alert-dim:#b04657;
    --glass-blur:18px;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --sans:"Space Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg0);color:var(--paper);font:14px/1.55 var(--sans);
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(90,116,208,0.28), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(125,227,208,0.18), transparent 55%),
      radial-gradient(ellipse at 100% 20%, rgba(122,162,255,0.12), transparent 50%);
    background-attachment:fixed;}
  #graph{position:fixed;inset:0;z-index:0;opacity:.92;}
  #graph::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0px,rgba(255,255,255,0.02) 1px,transparent 1px,transparent 3px);
    opacity:0.3;}
  #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 50%,rgba(11,16,32,0.5) 100%);}

  #labels{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
  .lbl{position:absolute;top:0;left:0;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--paper);white-space:nowrap;letter-spacing:.4px;text-shadow:0 0 10px rgba(0,0,0,0.6),0 1px 3px rgba(0,0,0,0.5);will-change:transform,opacity;}
  .lbl.core{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:4px;}
  .lbl.hubR{font-size:11.5px;color:var(--cool);}
  .lbl.hubM{font-size:11.5px;color:var(--accent);}
  .lbl.routine{color:var(--cool);opacity:.9;}
  .lbl.note{color:var(--accent);opacity:.9;}

  /* ---------- HUD: glass dial instead of soft orb ---------- */
  #hud{position:fixed;top:16px;left:18px;z-index:10;display:flex;align-items:center;gap:13px;
    padding:10px 16px 10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));}
  #orbwrap{width:44px;height:44px;position:relative;flex:none;}
  #orbwrap svg{width:100%;height:100%;display:block;overflow:visible;}
  #orbwrap .ring-bg{fill:none;stroke:var(--line-strong);stroke-width:2;}
  #orbwrap .ring-fg{fill:none;stroke:var(--accent-dim);stroke-width:2;stroke-linecap:round;
    stroke-dasharray:113;stroke-dashoffset:85;transform-origin:50% 50%;transform:rotate(-90deg);
    transition:stroke-dashoffset .5s ease,stroke .3s;}
  #orbwrap .core-dot{fill:var(--accent-dim);transition:fill .3s;}
  #orbwrap.listening .ring-fg{stroke:var(--cool);stroke-dashoffset:20;animation:sweep 1.1s ease-in-out infinite;}
  #orbwrap.listening .core-dot{fill:var(--cool);}
  #orbwrap.thinking .ring-fg,#orbwrap.deep .ring-fg{stroke:var(--accent);animation:sweep 1.6s ease-in-out infinite;}
  #orbwrap.thinking .core-dot,#orbwrap.deep .core-dot{fill:var(--accent);}
  #orbwrap.talking .ring-fg{stroke:var(--accent);stroke-dashoffset:40;animation:sweep .7s ease-in-out infinite;}
  #orbwrap.talking .core-dot{fill:var(--accent);animation:coretalk .4s ease-in-out infinite;}
  @keyframes sweep{0%,100%{stroke-dashoffset:100}50%{stroke-dashoffset:15}}
  @keyframes coretalk{0%,100%{r:3}50%{r:5}}

  #htext h1{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:5px;color:var(--accent);text-shadow:0 0 14px rgba(90,116,208,0.6);}
  #status{font-family:var(--mono);color:var(--dim);font-size:10.5px;letter-spacing:.5px;margin-top:1px;}
  #status::before{content:"●  ";color:var(--cool);font-size:8px;vertical-align:middle;}

  /* ---------- panels: glass ---------- */
  hr{display:none;}
  .panel{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));}
  .panel h2{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--dimmer);padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
  .panel h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-dim);flex:none;}
  .scroll{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
  .scroll::-webkit-scrollbar{width:4px;}.scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

  #thoughts{top:16px;right:16px;width:308px;max-height:44vh;}
  .thought{font-family:var(--mono);color:var(--dim);font-size:11.5px;padding-left:10px;border-left:2px solid var(--accent-dark);white-space:pre-wrap;word-wrap:break-word;animation:rise .2s ease both;}
  .thought.deepthink{color:var(--accent);border-left-color:var(--accent-dim);}
  .tool{font-family:var(--mono);font-size:11px;color:var(--cool);background:rgba(125,227,208,0.06);border:1px solid var(--line);border-radius:12px;border-left:2px solid var(--cool-dim);padding:8px 11px;white-space:pre-wrap;word-wrap:break-word;animation:rise .2s ease both;}
  .tool .res{color:var(--dim);display:block;margin-top:4px;font-size:10.5px;}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  #chatwrap{left:50%;transform:translateX(-50%);bottom:16px;width:min(660px,92vw);max-height:42vh;}
  #chat{max-height:30vh;}
  .msg{max-width:88%;padding:9px 14px;border:1px solid var(--line);border-radius:16px;white-space:pre-wrap;word-wrap:break-word;animation:rise .2s ease both;font-size:13px;font-family:var(--sans);}
  .msg.user{align-self:flex-end;background:rgba(125,227,208,0.10);border-color:var(--cool-dim);border-bottom-right-radius:6px;}
  .msg.assistant{align-self:flex-start;background:rgba(90,116,208,0.12);border-color:var(--line);border-bottom-left-radius:6px;}
  .msg.assistant::before{content:"LYDIA";display:block;font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--accent-dim);margin-bottom:4px;}
  .msg.user::before{content:"YOU";display:block;font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--cool-dim);margin-bottom:4px;}

  #composer{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:rgba(255,255,255,0.03);}
  #box{flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--line);color:var(--paper);padding:10px 15px;outline:none;font:13px var(--sans);border-radius:24px;transition:border-color .2s,box-shadow .2s;}
  #box:focus{border-color:var(--accent-dim);box-shadow:0 0 0 3px rgba(90,116,208,0.2);}
  #box::placeholder{color:var(--dimmer);}
  .cbtn{width:38px;height:38px;border:1px solid var(--line);background:rgba(255,255,255,0.05);color:var(--paper);font-size:14px;cursor:pointer;display:grid;place-items:center;transition:all .15s;flex:none;border-radius:12px;}
  .cbtn:hover{border-color:var(--accent-dim);color:var(--accent);}
  #send{background:var(--accent-dim);border-color:var(--accent-dim);color:#fff;font-weight:700;border-radius:12px;}
  #send:hover{background:var(--accent);border-color:var(--accent);box-shadow:0 0 16px rgba(90,116,208,0.5);}
  #mic.rec{background:var(--cool-dim);border-color:var(--cool);color:#fff;animation:blink 1s step-end infinite;border-radius:50%;}
  #stop{color:var(--alert-dim);}
  #stop.hot{background:var(--alert-dim);border-color:var(--alert);color:#fff;}
  #mute.on{background:var(--alert-dim);border-color:var(--alert);color:#fff;}
  #listenmute.on{background:var(--alert-dim);border-color:var(--alert);color:#fff;}
  @keyframes blink{50%{opacity:.5}}
  #orbwrap.deaf .ring-bg{stroke:var(--alert-dim);}
  #orbwrap.deaf .core-dot{fill:var(--alert-dim);}

  /* ---------- effort selector: glass toggle group ---------- */
  #effortbar{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;}
  .elabel{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:2.5px;color:var(--dimmer);flex:none;}
  .eseg{display:flex;gap:4px;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:14px;padding:3px;}
  .ebtn{border:0;background:transparent;color:var(--dim);font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.5px;padding:6px 13px;cursor:pointer;transition:all .2s;white-space:nowrap;border-radius:10px;}
  .ebtn:hover{color:var(--paper);background:rgba(255,255,255,0.05);}
  .ebtn.on{background:var(--accent-dim);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(90,116,208,0.35);}
  .ebtn[data-tier="ultra"].on{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(90,116,208,0.5);}

  #detail{position:fixed;z-index:20;top:50%;right:16px;transform:translateY(-50%);width:300px;max-height:60vh;background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:20px;display:none;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));}
  #detail.show{display:flex;animation:rise .18s ease both;}
  #detail .dhead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);}
  #detail .dtitle{font-weight:600;font-size:13.5px;font-family:var(--sans);}
  #detail .dbadge{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--accent-dim);}
  #detail .dclose{cursor:pointer;color:var(--dim);font-size:15px;line-height:1;}
  #detail .dclose:hover{color:var(--alert);}
  #detail .dbody{padding:14px 16px;overflow-y:auto;white-space:pre-wrap;word-wrap:break-word;font-size:12.5px;font-family:var(--sans);color:var(--dim);}
  #hint{position:fixed;bottom:16px;left:18px;z-index:10;color:var(--dimmer);font-family:var(--mono);font-size:10px;letter-spacing:.5px;
    padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));}

  /* ---------- provider meters: glass pills ---------- */
  #batteries{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 14px;
    backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));}
  .batt{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.55;transition:opacity .3s;min-width:70px;}
  .batt .bname{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:2px;color:var(--dimmer);transition:color .3s;}
  .bshell{display:flex;gap:2px;align-items:flex-end;height:16px;}
  .bled{width:6px;height:100%;background:var(--line);transition:background .25s;}
  .bled.fill-low{background:var(--alert-dim);}
  .bled.fill-mid{background:var(--accent-dim);}
  .bled.fill-hi{background:var(--accent);}
  .bpct{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:1px;}
  .bsub{font-size:8.5px;color:var(--dimmer);font-family:var(--mono);}
  .batt.active{opacity:1;}
  .batt.active .bname{color:var(--accent);}
  .batt.active .bpct{color:var(--paper);}

  /* ---------- schedule / plans: glass panel on the left ---------- */
  #schedule-panel{position:fixed;top:88px;left:18px;width:300px;max-height:52vh;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));}
  #schedule-panel .shead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 10px;border-bottom:1px solid var(--line);flex:none;}
  #schedule-panel h2{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--dimmer);display:flex;align-items:center;gap:8px;margin:0;padding:0;border:0;}
  #schedule-panel h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cool);box-shadow:0 0 8px var(--cool-dim);flex:none;}
  .sadd{width:26px;height:26px;border:1px solid var(--line);background:rgba(255,255,255,0.05);color:var(--cool);font-size:16px;line-height:1;cursor:pointer;border-radius:8px;display:grid;place-items:center;transition:all .15s;flex:none;}
  .sadd:hover{border-color:var(--cool-dim);color:var(--cool);box-shadow:0 0 10px rgba(125,227,208,0.4);}
  #sevents{flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;}
  #sevents::-webkit-scrollbar{width:4px;}#sevents::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
  .sev{background:rgba(255,255,255,0.03);border:1px solid var(--line);border-left:3px solid var(--accent-dim);border-radius:12px;padding:8px 10px;animation:rise .2s ease both;transition:border-color .2s;}
  .sev.soon{border-left-color:var(--cool);}
  .sev .stitle{font-size:13px;font-weight:600;color:var(--paper);}
  .sev .sdate{font-family:var(--mono);font-size:10px;color:var(--cool);margin-top:2px;}
  .sev .smeta{font-family:var(--mono);font-size:9px;color:var(--dimmer);margin-top:2px;}
  .sev .sacts{display:flex;gap:6px;margin-top:7px;}
  .sev .sacts button{flex:1;border:1px solid var(--line);background:transparent;color:var(--dim);font-family:var(--mono);font-size:9.5px;padding:4px 6px;border-radius:7px;cursor:pointer;transition:all .15s;}
  .sev .sacts button:hover{color:var(--paper);border-color:var(--accent-dim);}
  .sev .sacts button.sdel:hover{color:var(--alert);border-color:var(--alert-dim);}
  #sempty{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);text-align:center;padding:14px 8px;}

  .smform{display:flex;flex-direction:column;gap:7px;padding:11px 13px;border-top:1px solid var(--line);background:rgba(255,255,255,0.03);}
  .smform input{background:rgba(255,255,255,0.06);border:1px solid var(--line);color:var(--paper);padding:7px 10px;outline:none;font:12.5px var(--sans);border-radius:9px;transition:border-color .2s,box-shadow .2s;}
  .smform input:focus{border-color:var(--cool-dim);box-shadow:0 0 0 3px rgba(125,227,208,0.15);}
  .smform input::placeholder{color:var(--dimmer);}
  .smrow{display:flex;gap:7px;}
  .smrow button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,0.05);color:var(--paper);font-family:var(--mono);font-size:10px;padding:7px;cursor:pointer;border-radius:9px;transition:all .15s;}
  #ssave{background:var(--accent-dim);border-color:var(--accent-dim);color:#fff;font-weight:700;}
  #ssave:hover{background:var(--accent);box-shadow:0 0 12px rgba(90,116,208,0.5);}
  .smrow button.sdel{color:var(--alert);}
  .smrow button.sdel:hover{border-color:var(--alert-dim);}
  #schedule-msg{font-family:var(--mono);font-size:9.5px;color:var(--cool);padding:7px 13px;border-top:1px solid var(--line);min-height:14px;flex:none;}
</style>
</head>
<body>
<div id="graph"></div>
<div id="vignette"></div>
<div id="labels"></div>

<div id="hud">
  <div id="orbwrap">
    <svg viewBox="0 0 44 44">
      <circle class="ring-bg" cx="22" cy="22" r="18"></circle>
      <circle class="ring-fg" cx="22" cy="22" r="18"></circle>
      <circle class="core-dot" cx="22" cy="22" r="3"></circle>
    </svg>
  </div>
  <div id="htext"><h1>LYDIA</h1><div id="status">connecting</div></div>
</div>

<div id="batteries">
  <div class="batt" id="batt-groq"><div class="bname">GROQ</div><div class="bshell"></div><div class="bpct">—</div><div class="bsub">rate limit</div></div>
  <div class="batt" id="batt-deepseek"><div class="bname">DEEPSEEK</div><div class="bshell"></div><div class="bpct">—</div><div class="bsub">balance</div></div>
  <div class="batt" id="batt-kimi"><div class="bname">KIMI</div><div class="bshell"></div><div class="bpct">—</div><div class="bsub">balance</div></div>
</div>

<div id="thoughts" class="panel"><h2>Thoughts</h2><div class="scroll" id="thoughtscroll"></div></div>

<div id="chatwrap" class="panel">
  <div class="scroll" id="chat"></div>
  <div id="effortbar">
    <span class="elabel">EFFORT</span>
    <div id="effort" class="eseg">
      <button type="button" class="ebtn" data-tier="snappy" title="Fastest, least tokens — 20b on low reasoning, lean memory. Best for voice commands.">Snappy</button>
      <button type="button" class="ebtn" data-tier="balanced" title="Auto-escalates to the 120b brain on hard tasks, deeper memory. Snappy on simple stuff.">Balanced</button>
      <button type="button" class="ebtn" data-tier="max" title="Always the 120b brain thinking hard, deepest memory. Smartest — slower & most tokens.">Max</button>
      <button type="button" class="ebtn" data-tier="ultra" title="Pins the DeepSeek brain — strongest for code & hard reasoning, deepest memory. Slowest & priciest.">Ultra</button>
    </div>
  </div>
  <form id="composer">
    <input id="box" placeholder="Talk to Lydia…" autocomplete="off">
    <button type="button" id="lang" class="cbtn" title="Switch speaking language">EN</button>
    <button type="button" id="mute" class="cbtn" title="Mute voice">&#128266;</button>
    <button type="button" id="listenmute" class="cbtn" title="Stop Lydia listening">&#127908;</button>
    <button type="button" id="mic" class="cbtn" title="Push to talk">&#127911;</button>
    <button type="button" id="stop" class="cbtn" title="Stop talking">&#9632;</button>
    <button id="send" class="cbtn" title="Send">&#10148;</button>
  </form>
</div>

<div id="detail">
  <div class="dhead"><div><div class="dtitle"></div><div class="dbadge"></div></div>
    <div class="dclose" onclick="document.getElementById('detail').classList.remove('show')">&#10005;</div></div>
  <div class="dbody"></div>
</div>

<div id="hint">drag to orbit · scroll to zoom · click a node</div>

<!-- Schedule / Plans panel -->
<div id="schedule-panel">
  <div class="shead">
    <h2>Plans &amp; Schedule</h2>
    <button type="button" class="sadd" title="Add a plan" onclick="openScheduleForm()">+</button>
  </div>
  <div id="sevents">
    <div id="sempty">No plans yet. Click + to add one,<br>or just tell Lydia in chat.</div>
  </div>
  <div id="smform" class="smform" style="display:none;">
    <input id="smtitle" placeholder="Plan title…" autocomplete="off">
    <input id="smdate" type="datetime-local" placeholder="Date & time…">
    <div class="smrow">
      <button type="button" id="ssave">Save</button>
      <button type="button" class="sdel" id="scancel" onclick="hideScheduleForm()">Cancel</button>
    </div>
  </div>
  <div id="schedule-msg"></div>
</div>

<script src="vendor/3d-force-graph.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let ws, deepEl=null, G, nodeMap=new Map(), labelDivs=new Map(), firstData=true;

function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- 3D graph ---------- */
function initGraph(){
  G = ForceGraph3D()($('graph'))
    .backgroundColor('#0b1020')
    .nodeRelSize(5).nodeVal('size').nodeColor('color').nodeOpacity(0.95).nodeResolution(20)
    .linkColor(() => 'rgba(122,162,255,0.28)').linkWidth(0.7).linkOpacity(0.5)
    .linkDirectionalParticles(2).linkDirectionalParticleWidth(1.3)
    .linkDirectionalParticleSpeed(0.006)
    .linkDirectionalParticleColor(() => 'rgba(140,190,255,0.9)')
    .onNodeClick(showDetail)
    .onBackgroundClick(() => $('detail').classList.remove('show'))
    .width(window.innerWidth).height(window.innerHeight);
  G.d3Force('charge').strength(-150);
  window.addEventListener('resize', () => G.width(window.innerWidth).height(window.innerHeight));
  requestAnimationFrame(renderLabels);
}

const LBLCLASS = {core:'core', hubR:'hubR', hubM:'hubM', routine:'routine', note:'note', hub:''};

function buildDesired(routines, notesText){
  const nodes=[{id:'lydia',label:'LYDIA',color:'#7aa2ff',size:9,type:'core',lc:'core',content:'Your assistant, at the center of everything.'}];
  const links=[];
  nodes.push({id:'__routines',label:'Routines',color:'#7de3d0',size:5,type:'hub',lc:'hubR',content:'Learned routines.'});
  links.push({source:'lydia',target:'__routines'});
  (routines||[]).forEach((r,i)=>{
    const id='r_'+i;
    nodes.push({id,label:r.name,color:'#7de3d0',size:3.2,type:'routine',lc:'routine',content:`Trigger: "${r.trigger}"\n\n${r.steps}`});
    links.push({source:'__routines',target:id});
  });
  nodes.push({id:'__memory',label:'Memory',color:'#7aa2ff',size:5,type:'hub',lc:'hubM',content:'Things Lydia remembers.'});
  links.push({source:'lydia',target:'__memory'});
  const notes=(notesText||'').split('\n').map(s=>s.replace(/^-\s*/,'').trim()).filter(Boolean).slice(-24);
  notes.forEach((n,i)=>{
    const id='n_'+i;
    nodes.push({id,label:n.length>34?n.slice(0,34)+'…':n,color:'#7aa2ff',size:2.4,type:'note',lc:'note',content:n});
    links.push({source:'__memory',target:id});
  });
  return {nodes,links};
}

function updateGraph(routines, notesText){
  if(!G) return;
  const d=buildDesired(routines, notesText);
  const merged=d.nodes.map(n=>{const ex=nodeMap.get(n.id); if(ex){Object.assign(ex,n);return ex;} return n;});
  nodeMap=new Map(merged.map(n=>[n.id,n]));
  syncLabels(merged);
  G.graphData({nodes:merged, links:d.links});
  if(firstData){firstData=false; setTimeout(()=>G.zoomToFit(800,70),450);}
}

function syncLabels(nodes){
  const want=new Set(nodes.map(n=>n.id));
  for(const [id,div] of labelDivs){ if(!want.has(id)){div.remove(); labelDivs.delete(id);} }
  for(const n of nodes){
    let div=labelDivs.get(n.id);
    if(!div){div=document.createElement('div'); div.className='lbl '+(n.lc||''); $('labels').appendChild(div); labelDivs.set(n.id,div);}
    div.className='lbl '+(n.lc||'');
    div.textContent=n.label;
  }
}

function renderLabels(){
  if(G && G.camera){
    const cam=G.camera(); const m=cam.matrixWorld.elements;
    const cx=cam.position.x, cy=cam.position.y, cz=cam.position.z;
    const fx=-m[8], fy=-m[9], fz=-m[10];   // camera forward vector
    for(const [id,node] of nodeMap){
      const div=labelDivs.get(id);
      if(!div) continue;
      if(node.x==null){div.style.opacity=0;continue;}
      const dx=node.x-cx, dy=node.y-cy, dz=node.z-cz;
      if(dx*fx+dy*fy+dz*fz <= 0){div.style.opacity=0;continue;}   // behind camera
      const p=G.graph2ScreenCoords(node.x,node.y,node.z);
      if(!p){div.style.opacity=0;continue;}
      const dist=Math.hypot(dx,dy,dz);
      div.style.opacity=Math.max(0.12, Math.min(1, 520/dist));
      div.style.transform=`translate(-50%,-50%) translate(${p.x}px,${p.y + node.size*1.7 + 9}px)`;
    }
  }
  requestAnimationFrame(renderLabels);
}

function pulseCore(mode){
  const core=nodeMap.get('lydia'); if(!core) return;
  core.size = mode==='idle'?9:12;
  core.color = mode==='talking'?'#7aa2ff':mode==='listening'?'#7de3d0':mode==='thinking'?'#7aa2ff':'#7aa2ff';
  if(G) G.nodeColor('color').nodeVal('size');
}

function showDetail(node){
  const el=$('detail');
  el.querySelector('.dtitle').textContent=node.label;
  el.querySelector('.dbadge').textContent=node.type;
  el.querySelector('.dbody').textContent=node.content||'';
  el.classList.add('show');
  if(G && node.x!=null) G.cameraPosition({x:node.x,y:node.y,z:node.z+90}, node, 600);
}

/* ---------- websocket ---------- */
function connect(){
  const proto = location.protocol==='https:' ? 'wss:' : 'ws:';
  ws=new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen=()=>setStatus('connected');
  ws.onclose=()=>{setStatus('disconnected — retrying');setTimeout(connect,1500);};
  ws.onmessage=e=>handle(JSON.parse(e.data));
}
let curListening=true;
function setStatus(text){
  $('status').textContent=text;
  const orb=$('orbwrap'),mic=$('mic'),stop=$('stop');
  orb.className='';mic.classList.remove('rec');stop.classList.remove('hot');
  let mode='idle';
  if(/listen/i.test(text)){orb.classList.add('listening');mic.classList.add('rec');mode='listening';}
  else if(/deep/i.test(text)){orb.classList.add('deep');mode='thinking';}
  else if(/think/i.test(text)){orb.classList.add('thinking');mode='thinking';}
  else if(/talk/i.test(text)){orb.classList.add('talking');stop.classList.add('hot');mode='talking';}
  if(!curListening) orb.classList.add('deaf');
  pulseCore(mode);
}
function add(parent,el){parent.appendChild(el);parent.scrollTop=parent.scrollHeight;while(parent.children.length>200)parent.removeChild(parent.firstChild);}
function bubble(cls,text){const d=document.createElement('div');d.className=cls;d.textContent=text;return d;}
function handle(evt){
  switch(evt.type){
    case 'user': add($('chat'),bubble('msg user',evt.text)); break;
    case 'assistant': add($('chat'),bubble('msg assistant',evt.text)); break;
    case 'status': setStatus(evt.text); break;
    case 'thought':
      add($('thoughtscroll'),bubble('thought'+(evt.stream_start?' deepthink':''),evt.text));
      if(evt.stream_start){deepEl=bubble('thought deepthink','');add($('thoughtscroll'),deepEl);} break;
    case 'thought_delta':
      //if(!deepEl){deepEl=bubble('thought deepthink','');add($('thoughtscroll'),deepEl);}
      //deepEl.textContent+=evt.text;$('thoughtscroll').scrollTop=$('thoughtscroll').scrollHeight; break;
    case 'tool':{deepEl=null;const el=bubble('tool',`→ ${evt.name}(${JSON.stringify(evt.args)})`);el.dataset.tool=evt.name;add($('thoughtscroll'),el);break;}
    case 'tool_result':{const t=$('thoughtscroll').querySelectorAll('.tool');const last=t[t.length-1];
      if(last&&last.dataset.tool===evt.name&&!last.querySelector('.res')){const r=document.createElement('span');r.className='res';r.textContent=evt.text;last.appendChild(r);}break;}
    case 'state': updateGraph(evt.routines, evt.notes); break;
    case 'lang': curLang=evt.lang; $('lang').textContent=(evt.lang==='zh'?'中文':'EN');
      $('lang').title='Speaking: '+(evt.name||evt.lang)+' — click to switch'; break;
    case 'effort': setEffort(evt.tier); break;
    case 'mute': curMuted=evt.muted; $('mute').innerHTML=evt.muted?'&#128263;':'&#128266;';
      $('mute').classList.toggle('on',evt.muted);
      $('mute').title=evt.muted?'Voice muted — click to unmute':'Mute voice'; break;
    case 'listen': curListening=evt.listening; $('listenmute').classList.toggle('on',!evt.listening);
      $('listenmute').title=evt.listening?'Stop Lydia listening':'Not listening — click to resume';
      $('orbwrap').classList.toggle('deaf',!evt.listening); break;
    case 'battery': updateBattery(evt); break;
    case 'provider': glowProvider(evt.name); break;
    case 'schedule': renderSchedule(evt.events); break;
    case 'schedule_msg': $('schedule-msg').textContent=evt.text; break;
    case 'reminder':
      $('schedule-msg').textContent='⏰ '+evt.text;
      add($('chat'),bubble('msg assistant','⏰ '+evt.text));
      break;
  }
}
let curLang='en';

function fmtK(n){if(n==null)return '?';return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':(''+n);}
function curSym(c){return c==='CNY'?'¥':c==='USD'?'$':(c?c+' ':'');}
function buildLEDs(shell,pct){
  shell.innerHTML='';
  const total=12;
  const lit=pct==null?0:Math.round(Math.max(0,Math.min(100,pct))/100*total);
  const tier=pct==null?'':pct>50?'fill-hi':pct>=20?'fill-mid':'fill-low';
  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='bled'+(i<lit?' '+tier:'');
    shell.appendChild(d);
  }
}
function setBatt(el,pct,pctText,sub){
  const shell=el.querySelector('.bshell'),p=el.querySelector('.bpct'),s=el.querySelector('.bsub');
  buildLEDs(shell,pct);
  p.textContent=pct==null?'—':pctText;
  if(sub!=null)s.textContent=sub;
}
function updateBattery(evt){
  const g=evt.groq,d=evt.deepseek,k=evt.kimi;
  if(g)setBatt($('batt-groq'),g.pct,g.pct+'%',fmtK(g.remaining)+' / '+fmtK(g.limit)+' tok/min');
  else setBatt($('batt-groq'),null,null,'offline');
  if(d)setBatt($('batt-deepseek'),d.pct,curSym(d.currency)+Number(d.amount).toFixed(2),d.available===false?'unavailable':'balance');
  else setBatt($('batt-deepseek'),null,null,'offline');
  if(k)setBatt($('batt-kimi'),k.pct,curSym(k.currency)+Number(k.amount).toFixed(2),k.available===false?'unavailable':'balance');
  else setBatt($('batt-kimi'),null,null,'offline');
}
let glowTimer=null;
function glowProvider(name){
  const id=name==='deepseek'?'batt-deepseek':name==='groq'?'batt-groq':name==='kimi'?'batt-kimi':null;
  if(!id)return;
  document.querySelectorAll('.batt').forEach(b=>b.classList.remove('active'));
  $(id).classList.add('active');
  clearTimeout(glowTimer);
  glowTimer=setTimeout(()=>$(id).classList.remove('active'),4500);
}
$('composer').onsubmit=e=>{e.preventDefault();const t=$('box').value.trim();if(!t||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:'user_text',text:t}));$('box').value='';};
$('mic').onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'wake'}));};
$('stop').onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'stop'}));};
$('lang').onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'set_lang',lang:curLang==='en'?'zh':'en'}));};

function setEffort(tier){document.querySelectorAll('#effort .ebtn').forEach(b=>b.classList.toggle('on',b.dataset.tier===tier));}
document.querySelectorAll('#effort .ebtn').forEach(b=>{b.onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'set_effort',tier:b.dataset.tier}));};});
let curMuted=false;
$('mute').onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'set_mute',muted:!curMuted}));};
$('listenmute').onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'set_listen',listening:!curListening}));};

/* ---------- Schedule / Plans ---------- */
let sEvents=[];
function renderSchedule(list){
  sEvents=list||[];
  const host=$('sevents');
  host.innerHTML='';
  if(!sEvents.length){
    const el=document.createElement('div');
    el.id='sempty';
    el.textContent='No plans yet. Click + to add one, or just tell Lydia in chat.';
    host.appendChild(el);
    return;
  }
  const now=new Date();
  sEvents.forEach(ev=>{
    const d=document.createElement('div');
    d.className='sev';
    let dateStr=ev.date||'';
    let soon=false;
    const ts=Date.parse(dateStr.replace(' ', 'T'));
    if(!isNaN(ts)){
      const diff=ts-now.getTime();
      if(diff>=0 && diff < 3*3600*1000) soon=true;
      dateStr=new Date(ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    }
    if(soon)d.classList.add('soon');
    const t=document.createElement('div');t.className='stitle';t.textContent=ev.title;
    const dt=document.createElement('div');dt.className='sdate';dt.textContent=dateStr;
    const acts=document.createElement('div');acts.className='sacts';
    const ed=document.createElement('button');ed.textContent='Edit';
    ed.onclick=()=>openScheduleForm(ev);
    const del=document.createElement('button');del.className='sdel';del.textContent='Cancel';
    del.onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'schedule_delete',id:ev.id}));};
    acts.appendChild(ed);acts.appendChild(del);
    d.appendChild(t);d.appendChild(dt);d.appendChild(acts);
    host.appendChild(d);
  });
}
function openScheduleForm(ev){
  const f=$('smform');
  f.style.display='flex';
  $('smtitle').value=ev?ev.title:'';
  const dval=ev?ev.date.replace(' ', 'T'):'';
  $('smdate').value=dval;
  f.dataset.id=ev?ev.id:'';
  f.scrollIntoView({block:'nearest'});
}
function hideScheduleForm(){
  $('smform').style.display='none';
  $('smtitle').value='';
  $('smdate').value='';
  delete $('smform').dataset.id;
}
function saveSchedule(){
  if(!ws||ws.readyState!==1)return;
  const title=$('smtitle').value.trim();
  const raw=$('smdate').value;
  if(!title){$('schedule-msg').textContent='Enter a title.';return;}
  if(!raw){$('schedule-msg').textContent='Pick a date & time.';return;}
  const date=raw.replace('T', ' ')+':00';
  const id=$('smform').dataset.id;
  ws.send(JSON.stringify(id?{type:'schedule_update',id,title,date}:{type:'schedule_add',title,date}));
  hideScheduleForm();
}
$('ssave').onclick=saveSchedule;
$('smtitle').addEventListener('keydown',e=>{if(e.key==='Enter')saveSchedule();});

initGraph();
updateGraph([], '');
connect();
</script>
